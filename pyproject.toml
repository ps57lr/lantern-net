[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netdiag"
version = "0.3.0.dev3"
description = "Safe, layered network diagnostics for macOS and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matt Buttrick" }]
keywords = ["network", "diagnostics", "wifi", "dns", "troubleshooting"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
netdiag = "netdiag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["netdiag*"]

[tool.setuptools.package-data]
netdiag = ["schemas/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
